<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Admin | Kota Studio</title>
  <meta name="robots" content="noindex, nofollow">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
</head>
<body class="admin-page">

  <div class="container py-5" style="max-width: 480px;">

    <!-- LOGIN -->
    <div id="login-box">
      <h2 class="section-title text-center mb-4">Panel Administrador</h2>
      <form id="login-form">
        <div class="mb-3">
          <input id="admin-email" type="email" class="form-control" placeholder="Correo" required>
        </div>
        <div class="mb-3">
          <input id="admin-password" type="password" class="form-control" placeholder="Contraseña" required>
        </div>
        <button type="submit" class="btn btn-accent w-100">Iniciar sesión</button>
        <p id="login-error" class="text-danger text-center mt-3"></p>
      </form>
    </div>

    <!-- PANEL (oculto hasta hacer login) -->
    <div id="admin-panel" class="d-none">
      <h2 class="section-title text-center mb-4">Sumar Estrella</h2>
      <form id="estrella-form">
        <div class="mb-3">
          <input id="cliente-telefono" type="tel" class="form-control" placeholder="Teléfono del cliente" required>
        </div>
        <div class="mb-3">
          <input id="cliente-nombre" type="text" class="form-control" placeholder="Nombre (solo si es cliente nuevo)">
        </div>
        <button type="submit" class="btn btn-accent w-100">+1 Estrella</button>
      </form>
      <p id="estrella-resultado" class="text-center mt-4"></p>
      <button id="logout-btn" class="btn btn-outline-accent w-100 mt-4">Cerrar sesión</button>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script type="module" src="js/config/firebase.js"></script>
  <script type="module" src="js/admin.js"></script>
</body>
</html>
