<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Admin | Kota Space</title>
  <meta name="robots" content="noindex, nofollow">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
</head>
<body class="admin-page">

  <div class="container">
    <div class="admin-brand">
      <img src="assets/img/logo/logo.jpg" alt="Logo Kota Space" class="admin-brand__logo">
      <p class="admin-brand__caption">Panel de administración</p>
    </div>

    <!-- LOGIN -->
    <div id="login-box">
      <h1 class="section-title text-center mb-4">Iniciar sesión</h1>
      <form id="login-form">
        <div class="mb-3">
          <input id="admin-password" type="password" class="form-control" placeholder="Contraseña" required>
        </div>
        <button type="submit" class="btn btn-accent w-100">Iniciar sesión</button>
        <p id="login-error" class="text-danger text-center mt-3"></p>
      </form>
    </div>

    <!-- PANEL (oculto hasta hacer login) -->
    <div id="admin-panel" class="d-none">
      <section class="admin-stats" aria-labelledby="stats-title">
        <h2 id="stats-title" class="section-title text-center mb-4">Estadísticas</h2>
        <div class="admin-stats-grid">
          <article class="admin-stat-card">
            <span>Clientes registrados</span>
            <strong id="stats-clientes">-</strong>
          </article>
          <article class="admin-stat-card">
            <span>Estrellas acumuladas</span>
            <strong id="stats-estrellas">-</strong>
          </article>
          <article class="admin-stat-card">
            <span>Recompensas disponibles</span>
            <strong id="stats-recompensas">-</strong>
          </article>
        </div>
        <p id="stats-resultado" class="text-center mt-3 mb-4"></p>
      </section>
      <h2 class="section-title text-center mb-4">Sumar estrella</h2>
      <form id="estrella-form">
        <div class="mb-3">
          <input id="cliente-telefono" type="tel" class="form-control" placeholder="Teléfono del cliente" required>
        </div>
        <div class="mb-3">
          <input id="cliente-nombre" type="text" class="form-control" placeholder="Nombre (solo si es cliente nuevo)">
        </div>
        <button type="submit" class="btn btn-accent w-100">+1 Estrella</button>
      </form>
      <p id="estrella-resultado" class="text-center mt-4"></p>
      <button id="logout-btn" class="btn btn-outline-accent w-100 mt-4">Cerrar sesión</button>
    </div>

  </div>

  <script type="module" src="js/admin.js"></script>
</body>
</html>
